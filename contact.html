<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Chalachew Belay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="profile-section">
            <img src="profile.jpg" alt="Profile" onerror="this.src='https://via.placeholder.com/80'">
            <h2>Dev<span>Portfolio</span></h2>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="home-link">Home</a>
            <a href="about.html" class="about-link">About</a>
            <a href="skills.html" class="skills-link">Skills</a>
            <a href="projects.html" class="projects-link">Projects</a>
            <a href="education.html" class="education-link">Education</a>
            <a href="contact.html" class="contact-link active">Contact</a>
        </nav>
    </aside>

    <main class="main-content">
        <section class="page-header">
            <h2>Get in Touch</h2>
            <p>Have a question or want to work together? Send me a message!</p>
        </section>

        <!-- Contact Form Card -->
        <div class="card" style="max-width: 600px; margin: 0 auto; padding: 30px;">
            <!-- Formspree Endpoint ተስተካክሏል -->
            <form action="https://formspree.io/f/xljdkzbj" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                
                <div>
                    <label for="name" style="display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b;">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;">
                </div>

                <div>
                    <label for="email" style="display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b;">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email address" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;">
                </div>

                <div>
                    <label for="message" style="display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b;">Your Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your message here..." style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; resize: vertical;"></textarea>
                </div>

                <button type="submit" style="background-color: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: 700; border-radius: 6px; cursor: pointer; transition: background 0.2s;">
                    Send Message 🚀
                </button>
            </form>
        </div>
    </main>
</body>
</html>
