<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Chalachew Belay</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Contact Page Custom Styling */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h2 {
            color: #1e293b;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .page-header p {
            color: #64748b;
            font-size: 1.1rem;
        }
        .contact-card {
            background: #ffffff;
            max-width: 650px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #047857; /* ከድረ-ገጽህ አረንጓዴ ከለር ጋር እንዲጣጣም */
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #047857;
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }
        .submit-btn {
            background-color: #047857; /* አረንጓዴ ከለር */
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .submit-btn:hover {
            background-color: #065f46; /* ሲነኩት የሚጠቁር አረንጓዴ */
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="profile-section">
            <img src="profile.jpg" alt="Profile" onerror="this.src='https://via.placeholder.com/80'">
            <h2>Dev<span>Portfolio</span></h2>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="home-link">Home</a>
            <a href="about.html" class="about-link">About</a>
            <a href="skills.html" class="skills-link">Skills</a>
            <a href="projects.html" class="projects-link">Projects</a>
            <a href="education.html" class="education-link">Education</a>
            <a href="contact.html" class="contact-link active">Contact</a>
        </nav>
    </aside>

    <main class="main-content">
        <!-- ርዕሱ ወደ መሃል (Center) እንዲሆን ተደርጓል -->
        <section class="page-header">
            <h2>Get in Touch</h2>
            <p>Have a question or want to work together? Send me a message!</p>
        </section>

        <!-- Contact Form Card with Green Theme -->
        <div class="contact-card">
            <form action="https://formspree.io/f/xljdkzbj" method="POST">
                
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message 🚀
                </button>
            </form>
        </div>
    </main>
</body>
</html>
